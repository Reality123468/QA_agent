spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: qa-document
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qa_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:hwx1314520}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${DOCUMENT_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:qa-agent-jwt-secret-key-2026-mvp-minlength-256bit}
    expiration: ${JWT_EXPIRATION:86400000}
  agent:
    api-key: ${AGENT_API_KEY:qa-agent-internal-api-key-2026}
    base-url: ${AGENT_BASE_URL:http://localhost:8000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123456}
  bucket: ${MINIO_BUCKET:qa-documents}
